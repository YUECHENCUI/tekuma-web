<!doctype html>
<html lang="zh-CN" data-lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TEKUMA 塔科玛 · 城市创新咨询</title>
  <meta name="description" content="塔科玛是一个领先的城市创新咨询公司，桥接战略与设计。TEKUMA is a leading urban innovation consultancy bridging strategy and design.">
  <meta name="theme-color" content="#E84728">
  <link rel="icon" href="assets/img/mark.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/InterVariable-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="home">

  <!-- P1 · Hero ------------------------------------------------------------>
  <header class="hero" id="top">
    <nav class="nav">
      <a class="wordmark" href="./">TEKUMA</a>
      <div class="nav-links">
        <button type="button" data-set-lang="en">EN</button>
        <button type="button" data-set-lang="zh">中文</button>
        <a href="https://github.com/YUECHENCUI/tekuma-web" target="_blank" rel="noopener" data-i18n="nav.github">GitHub</a>
      </div>
    </nav>

    <div class="hero-body">
      <h1 class="hero-title" data-i18n="hero.title">TEKUMA 塔科玛</h1>
      <p class="hero-intro" data-i18n="hero.intro">塔科玛是一个领先的城市创新咨询公司，桥接战略与设计，帮助政府、开发商和利益相关者塑造韧性、繁荣且富有启发性的城市。致力于构建全球城市空间的叙事资产，推动城市文明的进化。</p>
    </div>

    <a class="scroll-cue" href="#map">
      <span class="scroll-cue-circle" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 5v14M6 13l6 6 6-6" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
      </span>
      <span class="scroll-cue-text" data-i18n="hero.cta">查看项目地图</span>
    </a>
    <canvas class="grain" data-fade="down" aria-hidden="true"></canvas>
  </header>

  <main>
    <!-- P2 · Project map ---------------------------------------------------->
    <section class="map" id="map" aria-label="Project map">
      <canvas class="map-canvas" aria-hidden="true"></canvas>
      <svg class="map-overlay"></svg>

      <div class="map-filters">
        <p class="map-kicker" data-i18n="map.title">项目地图</p>
        <div class="map-filter-cols">
          <ul class="map-regions" role="list"></ul>
          <ul class="map-years" role="list"></ul>
        </div>
      </div>

      <ul class="map-legend" role="list"></ul>

      <div class="map-foot">
        <p class="map-count"></p>
        <p class="map-credit" data-i18n="map.credit">地图数据：阿里云 DataV · Natural Earth</p>
      </div>

      <div class="map-card" hidden></div>
    </section>

    <!-- P3 · About & services ----------------------------------------------->
    <section class="about" id="about">
      <canvas class="grain" data-fade="up" aria-hidden="true"></canvas>
      <p class="about-intro" data-i18n="about.intro">塔科玛是一个加速城市创新的引擎，由一群技术专家、未来学家和设计师驱动。从初步战略制定到实施，我们的跨学科团队在四个综合实践领域提供端到端的咨询服务。</p>
      <div class="services" id="services"></div>
      <footer class="footer">
        <span data-i18n="footer.copy">© TEKUMA 塔科玛</span>
        <a href="#top" class="footer-top" aria-label="Top">↑</a>
      </footer>
    </section>
  </main>

  <script src="vendor/d3.v7.min.js"></script>
  <script src="vendor/topojson-client.v3.min.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/common.js"></script>
  <script src="js/home.js"></script>
  <script src="js/map.js"></script>
</body>
</html>
